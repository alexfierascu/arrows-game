<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Arrows Escape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<section class="scr" id="s-home">
 <div class="top"><div class="coins"><svg viewBox="0 0 24 24"><use href="#coin"/></svg><span class="coinN">0</span></div><div class="sp"></div><button class="ib" id="gear" data-i18n-label="settings" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
 <div class="body">
  <div class="hero">
   <svg viewBox="0 0 120 120" aria-hidden="true"><rect x="4" y="4" width="112" height="112" rx="28" fill="#fff"/><g fill="none" stroke="#161b3d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M24 28h34v18"/><path d="M78 26v40h18"/><path d="M28 58v34h26"/><path d="M60 92V76h12"/><path d="M44 62h14"/></g><g fill="#161b3d"><path d="M58 54l-8-9h16z"/><path d="M104 66l-9 8V58z"/><path d="M62 92l-9 8V84z"/><path d="M80 76l-9 8V68z"/></g><path d="M36 62l9-8v16z" fill="#e5484d"/><path d="M44 62h14" stroke="#e5484d" stroke-width="7" stroke-linecap="round"/></svg>
   <div><h1>Arrows<br>Escape</h1><p data-i18n="tagline">Slide every arrow off the board.</p></div>
  </div>
  <div class="banner" id="wkBanner" hidden><svg viewBox="0 0 24 24"><use href="#coin"/></svg><span data-i18n="weekend">Double coins weekend: every reward ×2 until Sunday night.</span></div>
  <button class="btn main play" id="playBtn"><span data-i18n="play">Play</span> <small id="playLbl">1-1</small></button>
  <div class="tiles">
   <button class="tile ev" id="tEvent"></button>
   <button class="tile daily" id="tDaily"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><b data-i18n="tile.daily">Daily challenge</b><small id="dailySub"></small></button>
   <button class="tile" id="tWorlds"><svg class="i" viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg><b data-i18n="tile.worlds">Worlds</b><small id="worldsSub"></small></button>
   <button class="tile" id="tBoard"><svg class="i" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg><b data-i18n="tile.board">Leaderboard</b><small id="boardSub" data-i18n="tile.board.sub">Daily and all-time</small></button>
   <button class="tile" id="tShop"><svg class="i" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><b data-i18n="tile.shop">Superpowers</b><small id="shopSub"></small></button>
   <button class="tile" id="tBadges"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="M8.5 14 7 22l5-3 5 3-1.5-8"/></svg><b data-i18n="tile.badges">Badges and stats</b><small id="badgeSub"></small></button>
   <button class="tile" id="tGift"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1.5S10 8 12 8zm0 0c2-4 6-4 6-1.5S14 8 12 8z"/></svg><b data-i18n="tile.gift">Daily gift</b><small id="giftSub"></small></button>
  </div>
 </div>
</section>

<section class="scr" id="s-map" hidden>
 <div class="top"><button class="ib" data-go="home" data-i18n-label="back" aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2 data-i18n="tile.worlds">Worlds</h2><div class="coins"><svg viewBox="0 0 24 24"><use href="#coin"/></svg><span class="coinN">0</span></div></div>
 <div class="chips" id="chips"></div>
 <div class="body"><div class="band" id="band"></div><div class="levels" id="levels"></div></div>
</section>

<section class="scr" id="s-game" hidden>
 <div class="ghud">
  <button class="ib" id="pauseBtn" data-i18n-label="pause" aria-label="Pause"><svg class="i" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button>
  <div class="glbl"><b id="gTitle">1-1</b><small id="gSub">Paper Trail</small></div>
  <div class="hearts" id="hearts"></div>
  <div class="shieldI" id="shieldI" hidden data-i18n-title="shield.up" title="Shield up"><svg class="i" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/></svg></div>
 </div>
 <div class="boss" id="bossBar" hidden><div class="bp" id="bossPic"></div><div class="bi"><div class="bn"><b id="bossName"></b><span id="bossAtk"></span></div><div class="hp"><i id="bossHp"></i></div></div></div>
 <div class="timer" id="timer"><div class="tbar"><i id="tFill"></i></div><span id="tTxt">0:00</span></div>
 <div class="srow"><span><span data-i18n="score">Score</span> <b id="gScore">0</b></span><span id="gCombo"></span><span class="sp"></span><span id="gLeft"></span></div>
 <div id="stage"><canvas id="cv"></canvas><div id="pops"></div><div class="toast" id="toast"></div>
  <div class="zoom"><button class="ib" id="zin" data-i18n-label="zoom.in" aria-label="Zoom in"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button><button class="ib" id="zout" data-i18n-label="zoom.out" aria-label="Zoom out"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button><button class="ib" id="zfit" data-i18n-label="zoom.fit" aria-label="Fit board"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>
 </div>
 <div class="powers" id="powers"></div>
</section>

<section class="scr" id="s-board" hidden>
 <div class="top"><button class="ib" data-go="home" data-i18n-label="back" aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2 data-i18n="tile.board">Leaderboard</h2></div>
 <div class="tabs" id="btabs"><button class="tab on" data-t="daily" data-i18n="tab.today">Today</button><button class="tab" data-t="event" id="evTab">Event</button><button class="tab" data-t="total" data-i18n="tab.alltime">All-time</button><button class="tab" data-t="stars" data-i18n="tab.stars">Stars</button></div>
 <div class="body">
  <div class="nick"><input id="nick" maxlength="16" data-i18n-placeholder="nick.placeholder" placeholder="Your player name" data-i18n-label="nick.aria" aria-label="Player name"><button class="btn" id="nickSave" data-i18n="save">Save</button></div>
  <div class="rows" id="rows"></div><p class="note" id="bnote"></p>
 </div>
</section>

<section class="scr" id="s-shop" hidden>
 <div class="top"><button class="ib" data-go="home" data-i18n-label="back" aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2 data-i18n="tile.shop">Superpowers</h2><div class="coins"><svg viewBox="0 0 24 24"><use href="#coin"/></svg><span class="coinN">0</span></div></div>
 <div class="body"><div class="shop" id="shop"></div><p class="note" data-i18n="shop.note">Earn coins with stars, daily gifts, daily challenges and badges.</p></div>
</section>

<section class="scr" id="s-event" hidden>
 <div class="top"><button class="ib" data-go="home" data-i18n-label="back" aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2 data-i18n="title.event">Weekly event</h2><div class="coins"><svg viewBox="0 0 24 24"><use href="#coin"/></svg><span class="coinN">0</span></div></div>
 <div class="body"><div class="band" id="evBand"></div><div id="evBody"></div><p class="note" id="evNext"></p></div>
</section>

<section class="scr" id="s-badges" hidden>
 <div class="top"><button class="ib" data-go="home" data-i18n-label="back" aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2 data-i18n="tile.badges">Badges and stats</h2></div>
 <div class="body"><div class="stats" id="stats"></div><div class="badges" id="badges"></div></div>
</section>

<div class="modal" id="modal"><div class="mcard" id="mcard"></div></div>

<svg width="0" height="0" style="position:absolute"><defs>
 <symbol id="coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f5b70a"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#c98f00" stroke-width="2"/><path d="M12 8.5v7" stroke="#c98f00" stroke-width="2.2" stroke-linecap="round"/></symbol>
 <symbol id="star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.7 1.3 6.7L12 17.6l-6 3.3 1.3-6.7-5-4.7 6.8-.8z"/></symbol>
</defs></svg>


<script type="module" src="/js/main.js"></script>
</body>
</html>
